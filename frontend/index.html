<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>TESTANDO UMA REQUISIÇÃO FETCH À API PARA TESTAR O CORS</h1>
    <hr>

    <button id="fetch-button">Fazer Requisição Fetch</button>
    <div id="response-output"></div>

    <hr>

    <script>
        document.getElementById('fetch-button').addEventListener('click', () => {
            fetch('http://localhost/api/v1/status')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok ' + response.statusText);
                    }
                    return response.json();
                })
                .then(data => {
                    document.getElementById('response-output').innerText = JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    document.getElementById('response-output').innerText = 'Fetch error: ' + error.message;
                });
        });
    </script>
    
</body>
</html>
